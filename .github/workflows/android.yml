name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create missing gradlew file
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Debug Keystore
      run: |
        mkdir -p app/src/debug
        keytool -genkey -v -keystore app/src/debug/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Sonu, OU=JEE Prep, O=Sonu App, L=Bihar, S=Bihar, C=IN"

    - name: Build Debug APK (Bypass Firebase)
      run: ./gradlew assembleDebug -x processDebugGoogleServices

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JEE-Prep-App
        path: app/build/outputs/apk/debug/*.apk


